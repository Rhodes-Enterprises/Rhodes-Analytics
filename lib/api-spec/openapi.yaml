openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Rhodes Analytics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: snowflake
    description: Snowflake connectivity
  - name: dashboards
    description: BI dashboards
paths:
  /dashboards/overview-with-targets/filters:
    get:
      operationId: getOwtFilters
      tags: [dashboards]
      summary: Filter options for the Overview with Targets dashboard
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwtFilterOptions"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/overview-with-targets:
    get:
      operationId: getOwtDashboard
      tags: [dashboards]
      summary: Overview with Targets dashboard data
      parameters:
        - $ref: "#/components/parameters/OwtTarget"
        - $ref: "#/components/parameters/OwtCompany"
        - $ref: "#/components/parameters/OwtDevelopment"
        - $ref: "#/components/parameters/OwtCohortQuarter"
        - $ref: "#/components/parameters/OwtLeadSource"
        - $ref: "#/components/parameters/OwtContactChannel"
        - $ref: "#/components/parameters/OwtDealChannel"
        - $ref: "#/components/parameters/OwtStartDate"
        - $ref: "#/components/parameters/OwtEndDate"
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwtDashboard"
        "400":
          description: Invalid date or range (malformed date, reversed range, or range crossing a calendar year)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/overview-with-targets/yoy:
    get:
      operationId: getOwtYoy
      tags: [dashboards]
      summary: Year-over-year monthly series for the Overview with Targets dashboard
      parameters:
        - $ref: "#/components/parameters/OwtCompany"
        - $ref: "#/components/parameters/OwtDevelopment"
      responses:
        "200":
          description: YOY series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwtYoy"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/website-traffic:
    get:
      operationId: getWebsiteTraffic
      tags: [dashboards]
      summary: Website Traffic dashboard data (Google Analytics)
      parameters:
        - $ref: "#/components/parameters/OwtTarget"
        - $ref: "#/components/parameters/OwtCompany"
        - $ref: "#/components/parameters/OwtDevelopment"
        - $ref: "#/components/parameters/OwtStartDate"
        - $ref: "#/components/parameters/OwtEndDate"
      responses:
        "200":
          description: Website traffic payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTraffic"
        "400":
          description: Invalid date or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/funnel:
    get:
      operationId: getFunnelMetric
      tags: [dashboards]
      summary: Funnel metric dashboard data (Leads, Tours, Gross Sales)
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [leads, tours, gross-sales]
        - $ref: "#/components/parameters/OwtTarget"
        - $ref: "#/components/parameters/OwtCompany"
        - $ref: "#/components/parameters/OwtDevelopment"
        - $ref: "#/components/parameters/OwtStartDate"
        - $ref: "#/components/parameters/OwtEndDate"
      responses:
        "200":
          description: Funnel metric payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelMetricDashboard"
        "400":
          description: Invalid date, range, or metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/ehi-goals:
    get:
      operationId: getEhiGoals
      tags: [dashboards]
      summary: EHI Goals dashboard data (full fiscal year attainment)
      parameters:
        - $ref: "#/components/parameters/OwtTarget"
        - $ref: "#/components/parameters/OwtStartDate"
        - $ref: "#/components/parameters/OwtEndDate"
      responses:
        "200":
          description: EHI goals payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhiGoals"
        "400":
          description: Invalid date or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/communities:
    get:
      operationId: getCommunities
      tags: [dashboards]
      summary: Community List directory with YTD funnel counts
      responses:
        "200":
          description: Community list payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityList"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /snowflake/status:
    get:
      operationId: getSnowflakeStatus
      tags: [snowflake]
      summary: Verify Snowflake connectivity
      description: Runs a probe query and reports the active session context
      responses:
        "200":
          description: Snowflake connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnowflakeStatus"
  /dashboards/leasing/filters:
    get:
      operationId: getLeasingFilters
      tags: [dashboards]
      summary: Filter options for the Rhodes Living Leasing dashboard
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeasingFilterOptions"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/leasing:
    get:
      operationId: getLeasingDashboard
      tags: [dashboards]
      summary: Rhodes Living Leasing dashboard data
      parameters:
        - name: community
          in: query
          required: false
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            description: YYYY-MM-DD; defaults to Jan 1 of the current year
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            description: YYYY-MM-DD; defaults to Dec 31 of the current year
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeasingDashboard"
        "400":
          description: Invalid date or range (malformed date, reversed range, or range crossing a calendar year)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    OwtTarget:
      name: target
      in: query
      required: false
      schema:
        type: string
        enum: [proforma, business_plan, goal, waterfall]
        default: goal
    OwtCompany:
      name: company
      in: query
      required: false
      schema:
        type: string
    OwtDevelopment:
      name: development
      in: query
      required: false
      schema:
        type: string
    OwtCohortQuarter:
      name: cohortQuarter
      in: query
      required: false
      schema:
        type: string
    OwtLeadSource:
      name: leadSource
      in: query
      required: false
      schema:
        type: string
    OwtContactChannel:
      name: contactChannel
      in: query
      required: false
      schema:
        type: string
    OwtDealChannel:
      name: dealChannel
      in: query
      required: false
      schema:
        type: string
    OwtStartDate:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        description: YYYY-MM-DD; defaults to start of the current quarter
    OwtEndDate:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        description: YYYY-MM-DD; defaults to end of the current quarter
  schemas:
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OwtFilterOptions:
      type: object
      properties:
        companies:
          type: array
          items:
            type: string
        developments:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              development:
                type: string
            required: [company, development]
        cohortQuarters:
          type: array
          items:
            type: string
        leadSources:
          type: array
          items:
            type: string
        channels:
          type: array
          items:
            type: string
      required: [companies, developments, cohortQuarters, leadSources, channels]
    LeasingFilterOptions:
      type: object
      properties:
        communities:
          type: array
          items:
            type: string
        channels:
          type: array
          items:
            type: string
      required: [communities, channels]
    LeasingDashboard:
      type: object
      properties:
        appliedRange:
          type: object
          properties:
            startDate:
              type: string
            endDate:
              type: string
            toDate:
              type: string
          required: [startDate, endDate, toDate]
        fiscalYear:
          type: number
        kpis:
          type: object
          properties:
            leaseGoal:
              type: number
            leaseTdGoal:
              type: number
            leasesRatified:
              type: number
            leasesCancelled:
              type: number
            netLeases:
              type: number
            ptgVariance:
              type: number
            ptgPercent:
              type: ["number", "null"]
          required:
            [leaseGoal, leaseTdGoal, leasesRatified, leasesCancelled, netLeases, ptgVariance, ptgPercent]
        funnel:
          $ref: "#/components/schemas/LeasingFunnel"
        matrix:
          type: object
          properties:
            total:
              $ref: "#/components/schemas/OwtGoalCell"
            online:
              $ref: "#/components/schemas/OwtGoalCell"
            onsite:
              $ref: "#/components/schemas/OwtGoalCell"
            net:
              $ref: "#/components/schemas/OwtGoalCell"
          required: [total, online, onsite, net]
        communities:
          type: array
          items:
            $ref: "#/components/schemas/LeasingCommunityRow"
        monthly:
          type: array
          items:
            $ref: "#/components/schemas/LeasingMonthlyPoint"
      required: [appliedRange, fiscalYear, kpis, funnel, matrix, communities, monthly]
    LeasingFunnel:
      type: object
      description: Upstream Rhodes Living funnel stages vs their RL_* goals
      properties:
        webTraffic:
          $ref: "#/components/schemas/OwtGoalCell"
        leads:
          $ref: "#/components/schemas/OwtGoalCell"
        onlineLeads:
          $ref: "#/components/schemas/OwtGoalCell"
        onsiteLeads:
          $ref: "#/components/schemas/OwtGoalCell"
        firstTours:
          $ref: "#/components/schemas/OwtGoalCell"
        onlineFirstTours:
          $ref: "#/components/schemas/OwtGoalCell"
        onsiteFirstTours:
          $ref: "#/components/schemas/OwtGoalCell"
        moveIns:
          $ref: "#/components/schemas/OwtGoalCell"
      required:
        [webTraffic, leads, onlineLeads, onsiteLeads, firstTours, onlineFirstTours, onsiteFirstTours, moveIns]
    LeasingCommunityRow:
      type: object
      properties:
        community:
          type: string
        fullSpanGoal:
          type: number
        toDateGoal:
          type: number
        ratified:
          type: number
        onlineRatified:
          type: number
        onsiteRatified:
          type: number
        cancelled:
          type: number
        net:
          type: number
        ptgPercent:
          type: ["number", "null"]
      required:
        [community, fullSpanGoal, toDateGoal, ratified, onlineRatified, onsiteRatified, cancelled, net, ptgPercent]
    LeasingMonthlyPoint:
      type: object
      description: >
        Monthly actual vs goal per funnel stage. Stage goals are 0 when no
        matching RL_* goal type exists for the fiscal year / channel filter.
      properties:
        month:
          type: number
        ratified:
          type: number
        cancelled:
          type: number
        net:
          type: number
        goal:
          type: number
        webTraffic:
          type: number
        webTrafficGoal:
          type: number
        leads:
          type: number
        leadsGoal:
          type: number
        firstTours:
          type: number
        firstToursGoal:
          type: number
        moveIns:
          type: number
        moveInsGoal:
          type: number
      required:
        [month, ratified, cancelled, net, goal, webTraffic, webTrafficGoal, leads, leadsGoal, firstTours, firstToursGoal, moveIns, moveInsGoal]
    OwtGoalCell:
      type: object
      properties:
        fullSpanGoal:
          type: number
        toDateGoal:
          type: number
        actual:
          type: number
        ptgPercent:
          type: ["number", "null"]
      required: [fullSpanGoal, toDateGoal, actual, ptgPercent]
    OwtDashboard:
      type: object
      properties:
        appliedRange:
          type: object
          properties:
            startDate:
              type: string
            endDate:
              type: string
            toDate:
              type: string
            target:
              type: string
          required: [startDate, endDate, toDate, target]
        kpis:
          type: object
          properties:
            salesGoal:
              type: number
            salesTdGoal:
              type: number
            grossSales:
              type: number
            ptgVariance:
              type: number
            ptgPercent:
              type: ["number", "null"]
          required: [salesGoal, salesTdGoal, grossSales, ptgVariance, ptgPercent]
        trafficMatrix:
          type: object
          properties:
            online:
              type: object
              properties:
                websiteUsers:
                  $ref: "#/components/schemas/OwtGoalCell"
                leads:
                  $ref: "#/components/schemas/OwtGoalCell"
                tours:
                  $ref: "#/components/schemas/OwtGoalCell"
                sales:
                  $ref: "#/components/schemas/OwtGoalCell"
              required: [websiteUsers, leads, tours, sales]
            onsite:
              type: object
              properties:
                leads:
                  $ref: "#/components/schemas/OwtGoalCell"
                tours:
                  $ref: "#/components/schemas/OwtGoalCell"
                sales:
                  $ref: "#/components/schemas/OwtGoalCell"
              required: [leads, tours, sales]
            total:
              type: object
              properties:
                leads:
                  $ref: "#/components/schemas/OwtGoalCell"
                tours:
                  $ref: "#/components/schemas/OwtGoalCell"
              required: [leads, tours]
            newWebsiteUsers:
              type: number
          required: [online, onsite, total, newWebsiteUsers]
        divisions:
          type: array
          items:
            $ref: "#/components/schemas/OwtDivisionRow"
        developments:
          type: array
          items:
            $ref: "#/components/schemas/OwtDevelopmentRow"
        ratios:
          type: array
          items:
            $ref: "#/components/schemas/OwtRatioRow"
      required: [appliedRange, kpis, trafficMatrix, divisions, developments, ratios]
    OwtDevelopmentRow:
      allOf:
        - $ref: "#/components/schemas/OwtDivisionRow"
        - type: object
          properties:
            development:
              type: string
          required: [development]
    OwtDivisionRow:
      type: object
      properties:
        division:
          type: string
        newWebsiteUsers:
          type: number
        totalWebsiteUsers:
          type: number
        leads:
          type: number
        leadsPctOfTotal:
          type: number
        tours:
          type: number
        toursPctOfTotal:
          type: number
        sales:
          type: number
        salesPctOfTotal:
          type: number
        salesPtg:
          type: ["number", "null"]
        toursPtg:
          type: ["number", "null"]
        leadsPtg:
          type: ["number", "null"]
        onlineTrafficPtg:
          type: ["number", "null"]
        onlineLeadsPtg:
          type: ["number", "null"]
        onlineToursPtg:
          type: ["number", "null"]
        onlineSalesPtg:
          type: ["number", "null"]
        onsiteLeadsPtg:
          type: ["number", "null"]
        onsiteToursPtg:
          type: ["number", "null"]
        onsiteSalesPtg:
          type: ["number", "null"]
      required:
        [
          division,
          newWebsiteUsers,
          totalWebsiteUsers,
          leads,
          leadsPctOfTotal,
          tours,
          toursPctOfTotal,
          sales,
          salesPctOfTotal,
          salesPtg,
          toursPtg,
          leadsPtg,
          onlineTrafficPtg,
          onlineLeadsPtg,
          onlineToursPtg,
          onlineSalesPtg,
          onsiteLeadsPtg,
          onsiteToursPtg,
          onsiteSalesPtg,
        ]
    OwtRatioRow:
      type: object
      properties:
        name:
          type: string
        group:
          type: string
          enum: [total, online, onsite]
        goal:
          type: ["number", "null"]
        actual:
          type: number
        ptgPercent:
          type: ["number", "null"]
      required: [name, group, goal, actual, ptgPercent]
    OwtYoy:
      type: object
      properties:
        year:
          type: number
        priorYear:
          type: number
        measures:
          type: array
          items:
            type: object
            properties:
              measure:
                type: string
              points:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: number
                    currentYear:
                      type: number
                    priorYear:
                      type: number
                    goal:
                      type: number
                  required: [month, currentYear, priorYear, goal]
            required: [measure, points]
      required: [year, priorYear, measures]
    AppliedRange:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
        toDate:
          type: string
        target:
          type: string
      required: [startDate, endDate, toDate, target]
    WebsiteTraffic:
      type: object
      properties:
        appliedRange:
          $ref: "#/components/schemas/AppliedRange"
        kpis:
          type: object
          properties:
            totalUsers:
              type: number
            newUsers:
              type: number
            sessions:
              type: number
            engagedSessions:
              type: number
            pageViews:
              type: number
            engagementRate:
              type: number
            fullSpanGoal:
              type: number
            toDateGoal:
              type: number
            ptgPercent:
              type: ["number", "null"]
          required:
            [
              totalUsers,
              newUsers,
              sessions,
              engagedSessions,
              pageViews,
              engagementRate,
              fullSpanGoal,
              toDateGoal,
              ptgPercent,
            ]
        monthly:
          type: array
          items:
            type: object
            properties:
              month:
                type: number
              users:
                type: number
              newUsers:
                type: number
              sessions:
                type: number
            required: [month, users, newUsers, sessions]
        channels:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              users:
                type: number
              sessions:
                type: number
            required: [name, users, sessions]
        devices:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              users:
                type: number
            required: [name, users]
        developments:
          type: array
          items:
            type: object
            properties:
              development:
                type: string
              division:
                type: string
              users:
                type: number
              newUsers:
                type: number
              sessions:
                type: number
            required: [development, division, users, newUsers, sessions]
      required: [appliedRange, kpis, monthly, channels, devices, developments]
    FunnelBreakdownRow:
      type: object
      properties:
        division:
          type: string
        total:
          type: number
        online:
          type: number
        onsite:
          type: number
        toDateGoal:
          type: number
        ptgPercent:
          type: ["number", "null"]
      required: [division, total, online, onsite, toDateGoal, ptgPercent]
    FunnelMetricDashboard:
      type: object
      properties:
        appliedRange:
          $ref: "#/components/schemas/AppliedRange"
        metric:
          type: string
          enum: [leads, tours, gross-sales]
        kpis:
          type: object
          properties:
            total:
              type: number
            online:
              type: number
            onsite:
              type: number
            fullSpanGoal:
              type: number
            toDateGoal:
              type: number
            ptgPercent:
              type: ["number", "null"]
            onlineToDateGoal:
              type: number
            onlinePtgPercent:
              type: ["number", "null"]
            onsiteToDateGoal:
              type: number
            onsitePtgPercent:
              type: ["number", "null"]
          required:
            [
              total,
              online,
              onsite,
              fullSpanGoal,
              toDateGoal,
              ptgPercent,
              onlineToDateGoal,
              onlinePtgPercent,
              onsiteToDateGoal,
              onsitePtgPercent,
            ]
        monthly:
          type: array
          items:
            type: object
            properties:
              month:
                type: number
              total:
                type: number
              online:
                type: number
              onsite:
                type: number
              goal:
                type: number
            required: [month, total, online, onsite, goal]
        sources:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: number
            required: [name, count]
        divisions:
          type: array
          items:
            $ref: "#/components/schemas/FunnelBreakdownRow"
        developments:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/FunnelBreakdownRow"
              - type: object
                properties:
                  development:
                    type: string
                required: [development]
      required: [appliedRange, metric, kpis, monthly, sources, divisions, developments]
    EhiGoals:
      type: object
      properties:
        appliedRange:
          $ref: "#/components/schemas/AppliedRange"
        metrics:
          type: array
          items:
            type: object
            properties:
              metric:
                type: string
              label:
                type: string
              goalType:
                type: ["string", "null"]
              fullYearGoal:
                type: number
              toDateGoal:
                type: number
              actual:
                type: number
              attainmentPct:
                type: ["number", "null"]
              ptgPercent:
                type: ["number", "null"]
            required:
              [metric, label, goalType, fullYearGoal, toDateGoal, actual, attainmentPct, ptgPercent]
        divisions:
          type: array
          items:
            type: object
            properties:
              division:
                type: string
              metric:
                type: string
              label:
                type: string
              toDateGoal:
                type: number
              actual:
                type: number
              ptgPercent:
                type: ["number", "null"]
            required: [division, metric, label, toDateGoal, actual, ptgPercent]
      required: [appliedRange, metrics, divisions]
    CommunityList:
      type: object
      properties:
        communities:
          type: array
          items:
            type: object
            properties:
              development:
                type: string
              division:
                type: string
              city:
                type: string
              state:
                type: string
              postalCode:
                type: string
              isRental:
                type: boolean
              hasGoals:
                type: boolean

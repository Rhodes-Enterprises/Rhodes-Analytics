openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Rhodes Analytics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: snowflake
    description: Snowflake connectivity
  - name: dashboards
    description: BI dashboards
paths:
  /dashboards/overview-with-targets/filters:
    get:
      operationId: getOwtFilters
      tags: [dashboards]
      summary: Filter options for the Overview with Targets dashboard
      parameters:
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwtFilterOptions"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/overview-with-targets:
    get:
      operationId: getOwtDashboard
      tags: [dashboards]
      summary: Overview with Targets dashboard data
      parameters:
        - $ref: "#/components/parameters/OwtTarget"
        - $ref: "#/components/parameters/OwtCompany"
        - $ref: "#/components/parameters/OwtDevelopment"
        - $ref: "#/components/parameters/OwtCohortQuarter"
        - $ref: "#/components/parameters/OwtLeadSource"
        - $ref: "#/components/parameters/OwtContactChannel"
        - $ref: "#/components/parameters/OwtDealChannel"
        - $ref: "#/components/parameters/OwtStartDate"
        - $ref: "#/components/parameters/OwtEndDate"
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwtDashboard"
        "400":
          description: Invalid date or range (malformed date, reversed range, or range crossing a calendar year)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/overview-with-targets/yoy:
    get:
      operationId: getOwtYoy
      tags: [dashboards]
      summary: Year-over-year monthly series for the Overview with Targets dashboard
      parameters:
        - $ref: "#/components/parameters/OwtCompany"
        - $ref: "#/components/parameters/OwtDevelopment"
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: YOY series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwtYoy"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/website-traffic:
    get:
      operationId: getWebsiteTraffic
      tags: [dashboards]
      summary: Website Traffic dashboard data (Google Analytics)
      parameters:
        - $ref: "#/components/parameters/OwtTarget"
        - $ref: "#/components/parameters/OwtCompany"
        - $ref: "#/components/parameters/OwtDevelopment"
        - $ref: "#/components/parameters/OwtStartDate"
        - $ref: "#/components/parameters/OwtEndDate"
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: Website traffic payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTraffic"
        "400":
          description: Invalid date or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/funnel:
    get:
      operationId: getFunnelMetric
      tags: [dashboards]
      summary: Funnel metric dashboard data (Leads, Tours, Gross Sales)
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [leads, tours, gross-sales]
        - $ref: "#/components/parameters/OwtTarget"
        - $ref: "#/components/parameters/OwtCompany"
        - $ref: "#/components/parameters/OwtDevelopment"
        - $ref: "#/components/parameters/OwtStartDate"
        - $ref: "#/components/parameters/OwtEndDate"
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: Funnel metric payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelMetricDashboard"
        "400":
          description: Invalid date, range, or metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/ehi-goals:
    get:
      operationId: getEhiGoals
      tags: [dashboards]
      summary: EHI Goals dashboard data (full fiscal year attainment)
      parameters:
        - $ref: "#/components/parameters/OwtTarget"
        - $ref: "#/components/parameters/OwtStartDate"
        - $ref: "#/components/parameters/OwtEndDate"
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: EHI goals payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhiGoals"
        "400":
          description: Invalid date or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/communities:
    get:
      operationId: getCommunities
      tags: [dashboards]
      summary: Community List directory with YTD funnel counts
      parameters:
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: Community list payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityList"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /snowflake/status:
    get:
      operationId: getSnowflakeStatus
      tags: [snowflake]
      summary: Verify Snowflake connectivity
      description: Runs a probe query and reports the active session context
      responses:
        "200":
          description: Snowflake connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnowflakeStatus"
  /dashboards/leasing/filters:
    get:
      operationId: getLeasingFilters
      tags: [dashboards]
      summary: Filter options for the Rhodes Living Leasing dashboard
      parameters:
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeasingFilterOptions"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dashboards/leasing:
    get:
      operationId: getLeasingDashboard
      tags: [dashboards]
      summary: Rhodes Living Leasing dashboard data
      parameters:
        - name: community
          in: query
          required: false
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            description: YYYY-MM-DD; defaults to Jan 1 of the current year
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            description: YYYY-MM-DD; defaults to Dec 31 of the current year
        - $ref: "#/components/parameters/ForceRefresh"
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeasingDashboard"
        "400":
          description: Invalid date or range (malformed date, reversed range, or range crossing a calendar year)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Snowflake error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    ForceRefresh:
      name: refresh
      in: query
      required: false
      description: >-
        When true, this request bypasses the cache's stale-serve path and
        waits for live Snowflake data. The forced load still shares the
        cache's single-flight dedupe, and its result is stored for all other
        visitors.
      schema:
        type: boolean
    OwtTarget:
      name: target
      in: query
      required: false
      schema:
        type: string
        enum: [proforma, business_plan, goal, waterfall]
        default: goal
    OwtCompany:
      name: company
      in: query
      required: false
      schema:
        type: string
    OwtDevelopment:
      name: development
      in: query
      required: false
      schema:
        type: string
    OwtCohortQuarter:
      name: cohortQuarter
      in: query
      required: false
      schema:
        type: string
    OwtLeadSource:
      name: leadSource
      in: query
      required: false
      schema:
        type: string
    OwtContactChannel:
      name: contactChannel
      in: query
      required: false
      schema:
        type: string
    OwtDealChannel:
      name: dealChannel
      in: query
      required: false
      schema:
        type: string
    OwtStartDate:
      name: startDate
      in: query
      required: false
      schema:
        type: string
        description: YYYY-MM-DD; defaults to start of the current quarter
    OwtEndDate:
      name: endDate
      in: query
      required: false
      schema:
        type: string
        description: YYYY-MM-DD; defaults to end of the current quarter
  schemas:
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OwtFilterOptions:
      type: object
      properties:
        companies:
          type: array
          items:
            type: string
        developments:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              development:
                type: string
            required: [company, development]
        cohortQuarters:
          type: array
          items:
            type: string
        leadSources:
          type: array
          items:
            type: string
        channels:
          type: array
          items:
            type: string
      required: [companies, developments, cohortQuarters, leadSources, channels]
    LeasingFilterOptions:
      type: object
      properties:
        communities:
          type: array
          items:
            type: string
        channels:
          type: array
          items:
            type: string
      required: [communities, channels]
    LeasingDashboard:
      type: object
      properties:
        appliedRange:
          type: object
          properties:
            startDate:
              type: string
            endDate:
              type: string
            toDate:
              type: string
          required: [startDate, endDate, toDate]
        fiscalYear:
          type: number
        kpis:
          type: object
          properties:
            leaseGoal:
              type: number
            leaseTdGoal:
              type: number
            leasesRatified:
              type: number
            leasesCancelled:
              type: number
            netLeases:
              type: number
            ptgVariance:
              type: number
            ptgPercent:
              type: ["number", "null"]
          required:
            [leaseGoal, leaseTdGoal, leasesRatified, leasesCancelled, netLeases, ptgVariance, ptgPercent]
        funnel:
          $ref: "#/components/schemas/LeasingFunnel"
        matrix:
          type: object
          properties:
            total:
              $ref: "#/components/schemas/OwtGoalCell"
            online:
              $ref: "#/components/schemas/OwtGoalCell"
            onsite:
              $ref: "#/components/schemas/OwtGoalCell"
            net:
              $ref: "#/components/schemas/OwtGoalCell"
          required: [total, online, onsite, net]
        communities:
          type: array
          items:
            $ref: "#/components/schemas/LeasingCommunityRow"
        monthly:
          type: array
          items:
            $ref: "#/components/schemas/LeasingMonthlyPoint"
        dataAsOf:
          type: string
          description: >-
            ISO 8601 time the oldest cached query result feeding this payload
            was loaded from Snowflake — the honest "data as of" stamp under
            stale-while-revalidate serving.
        refreshing:
          type: boolean
          description: >-
            True when at least one underlying cache entry was served stale
            with a background refresh in flight (newer numbers arrive on the
            next load).
      required: [appliedRange, dataAsOf, refreshing, fiscalYear, kpis, funnel, matrix, communities, monthly]
    LeasingFunnel:
      type: object
      description: Upstream Rhodes Living funnel stages vs their RL_* goals
      properties:
        webTraffic:
          $ref: "#/components/schemas/OwtGoalCell"
        leads:
          $ref: "#/components/schemas/OwtGoalCell"
        onlineLeads:
          $ref: "#/components/schemas/OwtGoalCell"
        onsiteLeads:
          $ref: "#/components/schemas/OwtGoalCell"
        firstTours:
          $ref: "#/components/schemas/OwtGoalCell"
        onlineFirstTours:
          $ref: "#/components/schemas/OwtGoalCell"
        onsiteFirstTours:
          $ref: "#/components/schemas/OwtGoalCell"
        moveIns:
          $ref: "#/components/schemas/OwtGoalCell"
      required:
        [webTraffic, leads, onlineLeads, onsiteLeads, firstTours, onlineFirstTours, onsiteFirstTours, moveIns]
    LeasingCommunityRow:
      type: object
      properties:
        community:
          type: string
        fullSpanGoal:
          type: number
        toDateGoal:
          type: number
        ratified:
          type: number
        onlineRatified:
          type: number
        onsiteRatified:
          type: number
        cancelled:
          type: number
        net:
          type: number
        ptgPercent:
          type: ["number", "null"]
        webTraffic:
          description: >-
            Web traffic vs this community's web-traffic goal; the actual counts
            GA sessions matched via MATCHED_DEVELOPMENT_NAME. Null when GA has
            no development mapping for the community.
          oneOf:
            - $ref: "#/components/schemas/OwtGoalCell"
            - type: "null"
        leads:
          $ref: "#/components/schemas/OwtGoalCell"
        firstTours:
          $ref: "#/components/schemas/OwtGoalCell"
        moveIns:
          $ref: "#/components/schemas/OwtGoalCell"
      required:
        [community, fullSpanGoal, toDateGoal, ratified, onlineRatified, onsiteRatified, cancelled, net, ptgPercent, webTraffic, leads, firstTours, moveIns]
    LeasingMonthlyPoint:
      type: object
      description: >
        Monthly actual vs goal per funnel stage. Stage goals are 0 when no
        matching RL_* goal type exists for the fiscal year / channel filter.
      properties:
        month:
          type: number
        ratified:
          type: number
        cancelled:
          type: number
        net:
          type: number
        goal:
          type: number
        webTraffic:
          type: number
        webTrafficGoal:
          type: number
        leads:
          type: number
        leadsGoal:
          type: number
        firstTours:
          type: number
        firstToursGoal:
          type: number
        moveIns:
          type: number
        moveInsGoal:
          type: number
      required:
        [month, ratified, cancelled, net, goal, webTraffic, webTrafficGoal, leads, leadsGoal, firstTours, firstToursGoal, moveIns, moveInsGoal]
    OwtGoalCell:
      type: object
      properties:
        fullSpanGoal:
          type: number
        toDateGoal:
          type: number
        actual:
          type: number
        ptgPercent:
          type: ["number", "null"]
      required: [fullSpanGoal, toDateGoal, actual, ptgPercent]
    OwtDashboard:
      type: object
      properties:
        appliedRange:
          type: object
          properties:
            startDate:
              type: string
            endDate:
              type: string
            toDate:
              type: string
            target:
              type: string
          required: [startDate, endDate, toDate, target]
        kpis:
          type: object
          properties:
            salesGoal:
              type: number
            salesTdGoal:
              type: number
            grossSales:
              type: number
            ptgVariance:
              type: number
            ptgPercent:
              type: ["number", "null"]
          required: [salesGoal, salesTdGoal, grossSales, ptgVariance, ptgPercent]
        trafficMatrix:
          type: object
          properties:
            online:
              type: object
              properties:
                websiteUsers:
                  $ref: "#/components/schemas/OwtGoalCell"
                leads:
                  $ref: "#/components/schemas/OwtGoalCell"
                tours:
                  $ref: "#/components/schemas/OwtGoalCell"
                sales:
                  $ref: "#/components/schemas/OwtGoalCell"
              required: [websiteUsers, leads, tours, sales]
            onsite:
              type: object
              properties:
                leads:
                  $ref: "#/components/schemas/OwtGoalCell"
                tours:
                  $ref: "#/components/schemas/OwtGoalCell"
                sales:
                  $ref: "#/components/schemas/OwtGoalCell"
              required: [leads, tours, sales]
            unknown:
              type: object
              description: >-
                Leads/tours/sales with no Online/Onsite channel label
                ('Unknown' or missing in the CRM). Actuals only — no goals
                exist for this bucket. online + onsite + unknown reconciles
                with the totals shown.
              properties:
                leads:
                  type: number
                tours:
                  type: number
                sales:
                  type: number
              required: [leads, tours, sales]
            total:
              type: object
              properties:
                leads:
                  $ref: "#/components/schemas/OwtGoalCell"
                tours:
                  $ref: "#/components/schemas/OwtGoalCell"
              required: [leads, tours]
            newWebsiteUsers:
              type: number
          required: [online, onsite, unknown, total, newWebsiteUsers]
        divisions:
          type: array
          items:
            $ref: "#/components/schemas/OwtDivisionRow"
        developments:
          type: array
          items:
            $ref: "#/components/schemas/OwtDevelopmentRow"
        ratios:
          type: array
          items:
            $ref: "#/components/schemas/OwtRatioRow"
        unknownRecords:
          type: object
          description: >-
            The CRM records behind each trafficMatrix.unknown bucket — the
            actionable to-do list for fixing channel attribution at the
            source, delivered with the counts they explain.
          properties:
            leads:
              $ref: "#/components/schemas/OwtUnknownBucketList"
            tours:
              $ref: "#/components/schemas/OwtUnknownBucketList"
            sales:
              $ref: "#/components/schemas/OwtUnknownBucketList"
          required: [leads, tours, sales]
        dataAsOf:
          type: string
          description: >-
            ISO 8601 time the oldest cached query result feeding this payload
            was loaded from Snowflake — the honest "data as of" stamp under
            stale-while-revalidate serving.
        refreshing:
          type: boolean
          description: >-
            True when at least one underlying cache entry was served stale
            with a background refresh in flight (newer numbers arrive on the
            next load).
      required: [appliedRange, dataAsOf, refreshing, kpis, trafficMatrix, divisions, developments, ratios, unknownRecords]
    OwtDevelopmentRow:
      allOf:
        - $ref: "#/components/schemas/OwtDivisionRow"
        - type: object
          properties:
            development:
              type: string
          required: [development]
    OwtDivisionRow:
      type: object
      properties:
        division:
          type: string
        newWebsiteUsers:
          type: number
        totalWebsiteUsers:
          type: number
        leads:
          type: number
        leadsPctOfTotal:
          type: number
        tours:
          type: number
        toursPctOfTotal:
          type: number
        sales:
          type: number
        salesPctOfTotal:
          type: number
        salesPtg:
          type: ["number", "null"]
        toursPtg:
          type: ["number", "null"]
        leadsPtg:
          type: ["number", "null"]
        onlineTrafficPtg:
          type: ["number", "null"]
        onlineLeadsPtg:
          type: ["number", "null"]
        onlineToursPtg:
          type: ["number", "null"]
        onlineSalesPtg:
          type: ["number", "null"]
        onsiteLeadsPtg:
          type: ["number", "null"]
        onsiteToursPtg:
          type: ["number", "null"]
        onsiteSalesPtg:
          type: ["number", "null"]
        unknownLeads:
          type: number
          description: >-
            Leads in this row with no Online/Onsite channel label ('Unknown'
            or missing in the CRM). Counted directly from source rows — never
            derived as total − online − onsite — so within the row
            online + onsite + unknown equals the leads count.
        unknownTours:
          type: number
          description: >-
            Tours in this row with no Online/Onsite channel label; same
            direct-count semantics as unknownLeads.
        unknownSales:
          type: number
          description: >-
            Sales in this row with no Online/Onsite channel label; same
            direct-count semantics as unknownLeads.
      required:
        [
          division,
          newWebsiteUsers,
          totalWebsiteUsers,
          leads,
          leadsPctOfTotal,
          tours,
          toursPctOfTotal,
          sales,
          salesPctOfTotal,
          salesPtg,
          toursPtg,
          leadsPtg,
          onlineTrafficPtg,
          onlineLeadsPtg,
          onlineToursPtg,
          onlineSalesPtg,
          onsiteLeadsPtg,
          onsiteToursPtg,
          onsiteSalesPtg,
          unknownLeads,
          unknownTours,
          unknownSales,
        ]
    OwtRatioRow:
      type: object
      properties:
        name:
          type: string
        group:
          type: string
          enum: [total, online, onsite]
        goal:
          type: ["number", "null"]
        actual:
          type: number
        ptgPercent:
          type: ["number", "null"]
      required: [name, group, goal, actual, ptgPercent]
    OwtUnknownRecord:
      type: object
      description: One CRM record missing an Online/Onsite channel label
      properties:
        name:
          type: ["string", "null"]
          description: Deal name (sales) or contact full name (leads/tours)
        email:
          type: ["string", "null"]
          description: Contact email (leads/tours only; null for sales)
        development:
          type: ["string", "null"]
          description: Community of interest as entered on the CRM record
        division:
          type: ["string", "null"]
          description: Division attributed via the company dimension (null when unmapped)
        date:
          type: string
          description: Contract-ratified date (sales), create date (leads), or first-tour date (tours)
        rawChannel:
          type: ["string", "null"]
          description: Raw channel value on the record — e.g. the literal 'Unknown', or null when blank
        crmUrl:
          type: ["string", "null"]
          description: Link to the record in the CRM
      required: [name, email, development, division, date, rawChannel, crmUrl]
    OwtUnknownBucketList:
      type: object
      description: >-
        Record-level drill-down behind one unknown-channel matrix bucket.
        Rides inside the overview response — same payload, same data
        snapshot as the count it explains — so the dialog can never
        disagree with the on-screen row.
      properties:
        total:
          type: number
          description: >-
            Full count of unlabeled records in the range. Must equal the
            matching trafficMatrix.unknown bucket; both come from one
            Snowflake statement (audited).
        truncated:
          type: boolean
          description: True when more records exist than the capped list returns
        records:
          type: array
          items:
            $ref: "#/components/schemas/OwtUnknownRecord"
      required: [total, truncated, records]
    OwtYoy:
      type: object
      properties:
        year:
          type: number
        priorYear:
          type: number
        gaHistoryStart:
          type: ["string", "null"]
          description: >-
            Earliest GOOGLE_ANALYTICS_DATE with traffic rows (YYYY-MM-DD), or
            null when no Google Analytics history exists at all. Months before
            this date predate website tracking, so their websiteUsers points
            are null ("no data yet") rather than 0.
        measures:
          type: array
          items:
            type: object
            properties:
              measure:
                type: string
              points:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: number
                    currentYear:
                      type: ["number", "null"]
                      description: >-
                        Actual value, or null when the month predates the
                        measure's source history (websiteUsers months before
                        gaHistoryStart). True zeros after history began stay 0.
                    priorYear:
                      type: ["number", "null"]
                      description: >-
                        Prior-year value; null under the same no-history rule
                        as currentYear.
                    goal:
                      type: number
                  required: [month, currentYear, priorYear, goal]
            required: [measure, points]

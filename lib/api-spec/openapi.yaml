openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Rhodes Analytics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sites
    description: Site management
  - name: stats
    description: Site statistics
  - name: events
    description: Event ingestion and feeds
  - name: overview
    description: Cross-site overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /overview:
    get:
      operationId: getOverview
      tags: [overview]
      summary: Cross-site overview totals
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List sites with 24h stats and sparkline
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteOverview"
    post:
      operationId: createSite
      tags: [sites]
      summary: Register a new site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site
      parameters:
        - $ref: "#/components/parameters/SiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site and its events
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /collect:
    post:
      operationId: collectEvent
      tags: [events]
      summary: Ingest a pageview event from the tracking snippet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sites/{id}/events/recent:
    get:
      operationId: getRecentEvents
      tags: [events]
      summary: Recent events feed for a site
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sites/{id}/stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Headline stats with change vs previous period
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sites/{id}/stats/timeseries:
    get:
      operationId: getStatsTimeseries
      tags: [stats]
      summary: Visitors and pageviews over time
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Timeseries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeseriesPoint"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sites/{id}/stats/pages:
    get:
      operationId: getStatsPages
      tags: [stats]
      summary: Top pages by visitors
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Top pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageStat"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sites/{id}/stats/referrers:
    get:
      operationId: getStatsReferrers
      tags: [stats]
      summary: Top referrers by visitors
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Top referrers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferrerStat"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sites/{id}/stats/devices:
    get:
      operationId: getStatsDevices
      tags: [stats]
      summary: Browser, OS, and device type breakdowns
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Device breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBreakdown"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sites/{id}/stats/countries:
    get:
      operationId: getStatsCountries
      tags: [stats]
      summary: Top countries by visitors
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Top countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryStat"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  parameters:
    SiteId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Range:
      name: range
      in: query
      required: false
      schema:
        type: string
        enum: ["24h", "7d", "30d", "90d"]
        default: "7d"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Site:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        domain:
          type: string
        trackingId:
          type: string
        createdAt:
          type: string
      required: [id, name, domain, trackingId, createdAt]
    SiteOverview:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        domain:
          type: string
        trackingId:
          type: string
        createdAt:
          type: string
        visitors24h:
          type: number
        pageviews24h:
          type: number
        liveVisitors:
          type: number
        sparkline:
          type: array
          items:
            type: number
          description: Hourly pageview counts for the last 24 hours (oldest first)
      required:
        [
          id,
          name,
          domain,
          trackingId,
          createdAt,
          visitors24h,
          pageviews24h,
          liveVisitors,
          sparkline,
        ]
    SiteInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        domain:
          type: string
          minLength: 1
      required: [name, domain]
    SiteUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        domain:
          type: string
          minLength: 1
    EventInput:
      type: object
      properties:
        trackingId:
          type: string
        path:
          type: string
        referrer:
          type: ["string", "null"]
        visitorId:
          type: string
        userAgent:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
          description: ISO 3166-1 alpha-2 country code
        durationSeconds:
          type: ["number", "null"]
      required: [trackingId, path, visitorId]
    CollectResult:
      type: object
      properties:
        accepted:
          type: boolean
      required: [accepted]
    RecentEvent:
      type: object
      properties:
        id:
          type: number
        path:
          type: string
        referrer:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        countryName:
          type: ["string", "null"]
        browser:
          type: ["string", "null"]
        os:
          type: ["string", "null"]
        deviceType:
          type: ["string", "null"]
        occurredAt:
          type: string
      required: [id, path, occurredAt]
    StatsSummary:
      type: object
      properties:
        visitors:
          type: number
        pageviews:
          type: number
        bounceRate:
          type: number
          description: Percentage 0-100
        avgDurationSeconds:
          type: number
        visitorsChange:
          type: ["number", "null"]
          description: Percent change vs previous period; null when no prior data
        pageviewsChange:
          type: ["number", "null"]
        bounceRateChange:
          type: ["number", "null"]
        avgDurationChange:
          type: ["number", "null"]
        liveVisitors:
          type: number
          description: Unique visitors in the last 5 minutes
      required:
        [
          visitors,
          pageviews,
          bounceRate,
          avgDurationSeconds,
          visitorsChange,
          pageviewsChange,
          bounceRateChange,
          avgDurationChange,
          liveVisitors,
        ]
    TimeseriesPoint:
      type: object
      properties:
        bucket:
          type: string
          description: ISO timestamp for the start of the bucket
        visitors:
          type: number
        pageviews:
          type: number
      required: [bucket, visitors, pageviews]
    PageStat:
      type: object
      properties:
        path:
          type: string
        visitors:
          type: number
        pageviews:
          type: number
      required: [path, visitors, pageviews]
    ReferrerStat:
      type: object
      properties:
        referrer:
          type: string
          description: Referrer source, "Direct" when none
        visitors:
          type: number
      required: [referrer, visitors]
    BreakdownItem:
      type: object
      properties:
        name:
          type: string
        visitors:
          type: number
        percentage:
          type: number
      required: [name, visitors, percentage]
    DeviceBreakdown:
      type: object
      properties:
        browsers:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownItem"
        operatingSystems:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownItem"
        deviceTypes:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownItem"
      required: [browsers, operatingSystems, deviceTypes]
    CountryStat:
      type: object
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 code
        countryName:
          type: string
        visitors:
          type: number
      required: [country, countryName, visitors]
    Overview:
      type: object
      properties:
        totalSites:
          type: number
        visitors24h:
          type: number
        pageviews24h:
          type: number
        liveVisitors:
          type: number
        topSite:
          oneOf:
            - $ref: "#/components/schemas/TopSite"
            - type: "null"
      required: [totalSites, visitors24h, pageviews24h, liveVisitors, topSite]
    TopSite:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        domain:
          type: string
        visitors24h:
          type: number
      required: [id, name, domain, visitors24h]

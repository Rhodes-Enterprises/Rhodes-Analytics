openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Rhodes Analytics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: snowflake
    description: Snowflake connectivity
paths:
  /snowflake/status:
    get:
      operationId: getSnowflakeStatus
      tags: [snowflake]
      summary: Verify Snowflake connectivity
      description: Runs a probe query and reports the active session context
      responses:
        "200":
          description: Snowflake connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnowflakeStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    SnowflakeStatus:
      type: object
      properties:
        connected:
          type: boolean
        version:
          type: string
        user:
          type: string
        role:
          type: string
        warehouse:
          type: string
        database:
          type: string
        schema:
          type: string
        error:
          type: string
      required:
        - connected
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
